name: Deploy
on:
 push:
  branches: [master]
 workflow_dispatch:

concurrency:
    group: deploy-prod
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    IMAGE: ghcr.io/motogearpick/moto-gp-api-back

jobs:
    build:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      outputs:
        sha: ${{ steps.meta.outputs.sha }}
      steps:
        - uses: actions/checkout@v4

        - name: Set up Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Meta
          id: meta
          run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

        - name: Build & push
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: |
              ${{ env.IMAGE }}:latest
              ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

    deploy:
      needs: build
      runs-on: ubuntu-latest
      environment: prod
      steps:
        - name: SSH deploy
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ubuntu
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            script: |
              set -euo pipefail
              cd ~/app
              echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              export IMAGE_TAG=${{ needs.build.outputs.sha }}
              docker compose pull api
              docker compose run --rm --no-deps api node_modules/.bin/prisma migrate deploy --config=prisma/products/prisma.config.ts
              docker compose up -d --remove-orphans
              docker image prune -f
